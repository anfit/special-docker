# Publishes the image to GitHub Container Registry (public package, no credentials needed to pull).
#   push a tag vMAJOR.MINOR.PATCH  -> ghcr.io/<owner>/<repo>:MAJOR.MINOR.PATCH (+ :MAJOR.MINOR, :sha-<short>)
#   push to main                    -> ghcr.io/<owner>/<repo>:edge (+ :sha-<short>)
# First publish: the package is created private. Make it public once under
#   GitHub -> your profile/org -> Packages -> <repo> -> Package settings -> Change visibility.
name: release

on:
  push:
    tags: ["v*.*.*"]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test (in-memory store)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mbstring php-curl php-xml
          php tests/behavior_test.php memory

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
