# Production stack for a single docker host: the Special container, plain HTTP on host port 80.
# TLS is terminated outside (corporate load balancer, ALB, reverse proxy). Until one is attached, reach the
# app through an SSM port-forward and set SPECIAL_INSECURE_HTTP=1 (see docs/AWS_SETUP.md, "TLS").
# Started by /opt/special/deploy.sh, which writes ./.env next to this file. Do not edit on the host.

services:
  app:
    image: ${SPECIAL_IMAGE}
    restart: unless-stopped
    env_file: .env
    volumes:
      - special-data:/var/lib/special
    ports:
      - "${SPECIAL_HTTP_PORT:-80}:80"
    logging:
      driver: awslogs
      options:
        awslogs-region: ${SPECIAL_AWS_REGION}
        awslogs-group: ${SPECIAL_LOG_GROUP}
        awslogs-stream: app

volumes:
  special-data:
