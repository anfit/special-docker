<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted
        # Existing files (spec-copy.js) are served directly; everything else goes to the front controller.
        FallbackResource /index.php
    </Directory>

    # Apache strips the Authorization header before PHP sees it; the MCP endpoint needs it.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; form-action 'self' https: http:; base-uri 'none'"

    # Keep the proxy-facing log format useful: the real client address arrives in X-Forwarded-For.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
